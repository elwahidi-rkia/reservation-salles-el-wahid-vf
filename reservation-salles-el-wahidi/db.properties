# Configuration de la base de donnees ReservationDB
# Modes supportes : auto (essaie MySQL puis bascule sur H2 embarque), mysql, h2
db.mode=h2

# Configuration MySQL 8.0
mysql.url=jdbc:mysql://localhost:3306/ReservationDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
mysql.user=root
mysql.password=

# Configuration H2 (mode compatibilite MySQL)
h2.url=jdbc:h2:file:./database/ReservationDB_h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
h2.user=sa
h2.password=
